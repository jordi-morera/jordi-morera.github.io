name: Keep demos warm

# Las demos Spring Boot viven en el free tier de Render, que duerme las instancias tras 15 min sin tráfico.
# El keep-alive automático lo hace cron-job.org (L-V, 8-20h Madrid), porque los cron de GitHub no son puntuales.
# Este workflow queda como botón manual: lánzalo para despertar las demos antes de enviar un CV.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demos
        run: |
          for url in \
            https://book-service-7uad.onrender.com/actuator/health \
            https://mytodolistapp-bgic.onrender.com/ ; do
            curl -s -o /dev/null -w "%{http_code} $url\n" --max-time 90 "$url" || true
          done
